<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/gh/s5689/Seberla-Translator@main/age.js"></script>
    <title>Seberla Translator</title>

    <style>
      body,
      html {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        margin: 0;
        background-color: #696969;
        color: white;
      }

      div {
        display: flex;
      }

      #container {
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      #content {
        flex-direction: column;
        width: 80%;
        gap: 2rem;
      }

      #title {
        font-size: 24px;
        align-self: center;
      }

      #jsqminsb {
        position: relative;
        margin-bottom: 1rem;
        user-select: none;
      }

      #jsqminsb input {
        margin-right: 0.5rem;
      }

      #jsqminsb button {
        display: none;
        position: absolute;
        right: 0;
      }

      #jsqminsb button[show] {
        display: block;
      }

      #translator {
        display: flex;
        flex-direction: column;
      }

      #languages-container {
        justify-content: center;
        height: 60vh;
      }

      #languages-container textarea {
        font-size: 20px;
        color: white;
        width: 100%;
        height: 60%;

        padding: 1rem;
        background-color: transparent;
        border: 1px solid lightgray;

        resize: none;
      }

      #languages-container textarea:hover {
        cursor: text;
      }

      #languages-container textarea:focus {
        cursor: text;
        outline: none;
      }

      #spanish,
      #seberla {
        width: calc(50% - 0.5px);
      }

      #spanish textarea {
        border-right: none;
        border-radius: 10px 0 0 10px;
      }

      #seberla textarea {
        border-radius: 0 10px 10px 0;
      }
    </style>

    <script>
      var keysSpanish = {
        Q: 'P',
        W: 'Q',
        E: 'W',
        R: 'E',
        T: 'R',
        Y: 'T',
        U: 'Y',
        I: 'U',
        O: 'I',
        P: 'O',
        A: 'Ñ',
        S: 'A',
        D: 'S',
        F: 'D',
        G: 'F',
        H: 'G',
        J: 'H',
        K: 'J',
        L: 'K',
        Ñ: 'L',
        Z: 'M',
        X: 'Z',
        C: 'X',
        V: 'C',
        B: 'V',
        N: 'B',
        M: 'N',
      };

      var keysSeberla = {
        P: 'Q',
        Q: 'W',
        W: 'E',
        E: 'R',
        R: 'T',
        T: 'Y',
        Y: 'U',
        U: 'I',
        I: 'O',
        O: 'P',
        Ñ: 'A',
        A: 'S',
        S: 'D',
        D: 'F',
        F: 'G',
        G: 'H',
        H: 'J',
        J: 'K',
        K: 'L',
        L: 'Ñ',
        M: 'Z',
        Z: 'X',
        X: 'C',
        C: 'V',
        V: 'B',
        B: 'N',
        N: 'M',
      };
    </script>
  </head>

  <body>
    <div id="container">
      <div id="content">
        <div id="title">
          <h1>Seberla Translator</h1>
        </div>

        <div id="translator">
          <div id="jsqminsb">
            <input type="checkbox" name="jsqminsb-checkbox" id="jsqminsb-checkbox" />
            <label for="jsqminsb-checkbox">Juro Solemnemente Que Mis Intenciones No Son Buenas</label>

            <button>Proceder</button>
          </div>

          <div id="languages-container">
            <div id="spanish">
              <textarea type="text"></textarea>
            </div>

            <div id="seberla">
              <textarea type="text"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>

  <script>
    const spanishHTML = document.querySelector('#spanish textarea');
    const seberlaHTML = document.querySelector('#seberla textarea');
    const jsqminsb_Checkbox = document.querySelector('#jsqminsb input');
    const jsqminsb_Button = document.querySelector('#jsqminsb button');
    const changes = { spanish: 0, seberla: 0 };

    // Eventos
    spanishHTML.addEventListener('input', (e) => {
      exchange(spanishHTML, seberlaHTML, keysSpanish);
      changes.spanish = new Date().getTime();
    });

    seberlaHTML.addEventListener('input', (e) => {
      exchange(seberlaHTML, spanishHTML, keysSeberla);
      changes.seberla = new Date().getTime();
    });

    jsqminsb_Checkbox.addEventListener('change', (e) => {
      if (jsqminsb_Checkbox.checked) jsqminsb_Button.setAttribute('show', '');
      else jsqminsb_Button.removeAttribute('show');

      exchange(spanishHTML, seberlaHTML, keysSpanish);
    });

    jsqminsb_Button.addEventListener('click', (e) => {
      exchange(null, null, null, true);
    });

    // Funciones
    function exchange(from, toApply, keyList, is_jsqminsb_Button) {
      // jsqminsb
      if (jsqminsb_Checkbox.checked && is_jsqminsb_Button) {
        (async () => {
          const PASS = 'que-miras-cabezon-cara-de-bobo-?';

          if (changes.spanish > changes.seberla) {
            const encrypter = new age.Encrypter();
            encrypter.setPassphrase(PASS);

            seberlaHTML.value = age.armor.encode(await encrypter.encrypt(spanishHTML.value));
          } else {
            const decrypter = new age.Decrypter();
            decrypter.addPassphrase(PASS);

            spanishHTML.value = await decrypter.decrypt(age.armor.decode(seberlaHTML.value), 'text');
          }
        })();
      }
      // Seberla
      else {
        const fromText = eliminarAcentos(from.value);
        let toApplyText = '';

        for (const value of fromText) {
          const foundChar = keyList[value.toUpperCase()];

          if (value === ' ') {
            toApplyText += ' ';
          } else if (!foundChar) {
            toApplyText += value;
          } else {
            if (value === value.toUpperCase()) {
              toApplyText += foundChar;
            }

            if (value === value.toLowerCase()) {
              toApplyText += foundChar.toLowerCase();
            }
          }
        }

        toApply.value = toApplyText;
      }
    }

    function eliminarAcentos(texto) {
      if (!texto) {
        return texto;
      }

      let tempText = texto.replace(/Ñ/g, '@@N_TEMP@@');
      tempText = tempText.replace(/ñ/g, '@@n_temp@@');

      let textoProcesado = tempText.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      textoProcesado = textoProcesado.replace(/@@N_TEMP@@/g, 'Ñ');
      textoProcesado = textoProcesado.replace(/@@n_temp@@/g, 'ñ');

      return textoProcesado;
    }
  </script>
</html>
